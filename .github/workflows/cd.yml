name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

env:
  UV_MALWARE_CHECK: "1"

jobs:
  pypi-publish:
    name: upload release to PyPI
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv build

      - name: Smoke test built wheel in isolation
        run: |
          wheel=$(find dist -name '*.whl' -print -quit)
          test -n "$wheel"
          uv run --isolated --no-project --with "$wheel" python -c "import textris"

      - name: Generate PEP 740 publish attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      - run: uv publish
