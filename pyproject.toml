[project]
name = "textual-tetris"
description = "A Tetris game for your terminal, built with the Textual framework."
authors = [{name = "Martín Gaitán", email = "gaitan@gmail.com"}]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
keywords = ["tetris", "textual", "game", "console", "terminal"]
version = "0.3.1"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
    "Topic :: Terminals",
    "Environment :: Console",
]
dependencies = [
    "textual>=6.6.0",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "textris"

[tool.uv]
exclude-newer = "1 week"
exclude-newer-package = { ty = "0 days" }

[tool.ty.src]
exclude = [".worktrees/", ".external-worktrees/"]


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "W",      # pycodestyle (E, W) https://docs.astral.sh/ruff/rules/#pycodestyle-e-w
    "F",      # https://docs.astral.sh/ruff/rules/#pyflakes-f
    "I",      # isort
    "C90",    # https://docs.astral.sh/ruff/rules/#mccabe-c90
    "UP",     # https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "RUF",    # https://docs.astral.sh/ruff/rules/#ruff-specific-rules-ruf
    "T10",    # remove pdbs
    "ISC",    # https://docs.astral.sh/ruff/rules/#flake8-implicit-str-concat-isc
    "SIM",    # https://docs.astral.sh/ruff/rules/#flake8-simplify-sim
    "ASYNC",  # https://docs.astral.sh/ruff/rules/#flake8-async-async
    "B",      # https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
    "C4",     # https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
    "PIE",    # https://docs.astral.sh/ruff/rules/#flake8-pie-pie
    "FURB",   # https://docs.astral.sh/ruff/rules/#refurb-furb
    "TID252", # https://docs.astral.sh/ruff/rules/relative-imports/
]

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config", "-ra"]

[dependency-groups]
lint = [
    "ruff>=0.15.22",
]
qa = [
    { include-group = "lint" },
    "ty>=0.0.61",
]
test = [
    "pytest>=9.1.1",
]

[project.urls]
Repository = "https://github.com/mgaitan/textual-tetris"
Issues = "https://github.com/mgaitan/textual-tetris/issues"

[project.scripts]
textual-tetris = "textris:main"
